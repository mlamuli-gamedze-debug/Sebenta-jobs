<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sebenta Jobs - Find Work in Eswatini</title>
<meta name="description" content="Find work in Eswatini. Jobs for every level, from house helper to manager.">
<meta name="theme-color" content="#007bff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{margin:0;background:#eaf4ff;color:#111}
  header{background:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-icon{width:42px;height:42px;background:#0056b3;color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
  .logo b{font-size:19px;line-height:1}
  .logo span{font-size:12px;color:#666}
  .post-btn{background:#007bff;color:#fff;border:none;padding:10px 16px;border-radius:20px;font-weight:700;cursor:pointer}
  .hero{background:#007bff;color:#fff;padding:22px 16px 24px;border-radius:0 0 24px 24px}
  .hero h1{font-size:24px;line-height:1.2;margin:0 0 14px}
  .hero input{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;outline:none}
  #installBtn{display:none;width:100%;padding:14px;background:#fff;color:#007bff;border:none;border-radius:12px;font-weight:800;font-size:16px;margin-top:12px;cursor:pointer}
  .card{background:#fff;margin:16px;padding:18px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .card h2{margin:0;color:#007bff;font-size:20px}
  .card p{color:#666;font-size:13px;margin:6px 0 14px}
  input,select,textarea{width:100%;padding:13px;margin-bottom:10px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:#f8f9fa}
  textarea{resize:vertical;min-height:70px}
  .submit-btn{width:100%;background:#007bff;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer}
  .job{background:#fff;margin:0 16px 12px;padding:16px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .job b{font-size:17px}
  .job small{color:#666;display:block;margin:4px 0}
  .tag{display:inline-block;background:#eaf4ff;color:#007bff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;margin-right:6px}
  .apply-btn{background:#28a745;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:700;margin-top:10px;cursor:pointer}
  .delete-btn{background:none;border:none;color:#999;float:right;cursor:pointer}
  .section-title{padding:0 16px;font-size:18px;font-weight:800}
  .empty{text-align:center;color:#888;padding:30px 16px}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">S</div>
    <div><b>Sebenta Jobs</b><br><span>Find work in Eswatini</span></div>
  </div>
  <button class="post-btn" onclick="document.getElementById('postForm').scrollIntoView({behavior:'smooth'})">+ Post</button>
</header>

<div class="hero">
  <h1>Jobs for every level, from house helper to manager</h1>
  <input id="searchInput" type="text" placeholder="Search jobs in Manzini, Mbabane..." oninput="renderJobs()">
  <button id="installBtn">📲 Install Sebenta Jobs App - FREE</button>
  <p id="installHint" style="font-size:12px;opacity:.9;margin:8px 0 0;">On Android: Tap ⋮ → Install and create shortcut → Install. On iPhone: Share → Add to Home Screen.</p>
</div>

<div class="card" id="postForm">
  <h2>Post a Job - Free</h2>
  <p>Fill this in 2 minutes. It will appear immediately.</p>
  <input id="jobTitle" placeholder="Job Title - e.g. House Helper">
  <input id="company" placeholder="Company / Household Name">
  <select id="level">
    <option value="">Select Qualification Level</option>
    <option>No Qualification Needed</option>
    <option>Primary School</option>
    <option>Form 3 / JC</option>
    <option>Form 5 / Matric</option>
    <option>Diploma / Certificate</option>
    <option>Degree</option>
  </select>
  <input id="location" placeholder="Location - e.g. Manzini, Matsapha">
  <input id="salary" placeholder="Salary - e.g. E2500 / month (optional)">
  <input id="phone" placeholder="WhatsApp / Phone Number">
  <textarea id="desc" placeholder="Job Description - duties, hours, etc."></textarea>
  <button class="submit-btn" onclick="postJob()">Post Job Now →</button>
</div>

<h3 class="section-title">Latest Jobs (<span id="jobCount">0</span>)</h3>
<div id="jobsList"></div>

<script>
// --- JOBS DATA ---
let jobs = JSON.parse(localStorage.getItem('sebenta_jobs') || '[]');
if(jobs.length === 0){
  jobs = [
    {title:"House Helper", company:"Private Household - Manzini", level:"No Qualification Needed", location:"Manzini", salary:"E2500 / month", phone:"76000000", desc:"Cleaning, cooking, laundry. Monday - Friday, 8am - 4pm."},
    {title:"Shop Assistant", company:"Matsapha Supermarket", level:"Form 5 / Matric", location:"Matsapha", salary:"E3500 / month", phone:"76111111", desc:"Serving customers, stocking shelves. Must be friendly and honest."},
    {title:"Driver", company:"Delivery Company", level:"Form 3 / JC", location:"Mbabane", salary:"E4500 / month", phone:"76222222", desc:"Delivery driver. Must have valid license. Code 8."}
  ];
  localStorage.setItem('sebenta_jobs', JSON.stringify(jobs));
}

function renderJobs(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const list = document.getElementById('jobsList');
  const filtered = jobs.filter(j => (j.title+' '+j.company+' '+j.location+' '+j.level).toLowerCase().includes(q));
  document.getElementById('jobCount').textContent = filtered.length;
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">No jobs found.<br>Try a different search or post a job!</div>';
    return;
  }
  list.innerHTML = filtered.map((j, i) => `
    <div class="job">
      <button class="delete-btn" onclick="deleteJob(${jobs.indexOf(j)})">✕</button>
      <b>${j.title}</b>
      <small>${j.company} • ${j.location}</small>
      <span class="tag">${j.level}</span> <span class="tag">${j.salary || 'Salary to discuss'}</span>
      <p style="font-size:14px;color:#333;margin:10px 0;">${j.desc}</p>
      <a href="https://wa.me/268${j.phone.replace(/[^0-9]/g,'').slice(-8)}?text=Hi, I saw your ${encodeURIComponent(j.title)} job on Sebenta Jobs. I want to apply." target="_blank"><button class="apply-btn">Apply on WhatsApp →</button></a>
    </div>
  `).join('');
}

function postJob(){
  const title = document.getElementById('jobTitle').value.trim();
  const company = document.getElementById('company').value.trim();
  const level = document.getElementById('level').value;
  const location = document.getElementById('location').value.trim();
  const salary = document.getElementById('salary').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const desc = document.getElementById('desc').value.trim();
  if(!title || !company || !level || !location || !phone){
    alert('Please fill Job Title, Company, Qualification, Location and Phone.');
    return;
  }
  jobs.unshift({title, company, level, location, salary, phone, desc: desc || 'Contact for more details.'});
  localStorage.setItem('sebenta_jobs', JSON.stringify(jobs));
  ['jobTitle','company','location','salary','phone','desc'].forEach(id => document.getElementById(id).value='');
  document.getElementById('level').value='';
  renderJobs();
  alert('Job posted! It is now live.');
  document.getElementById('jobsList').scrollIntoView({behavior:'smooth'});
}

function deleteJob(idx){
  if(confirm('Delete this job?')){ jobs.splice(idx,1); localStorage.setItem('sebenta_jobs', JSON.stringify(jobs)); renderJobs(); }
}

renderJobs();

// --- INSTALL BUTTON ---
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
  }
});

// --- SERVICE WORKER ---
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
